difficulty_explanation = "Requires deriving a Pouch-owned OCI security profile from several vendored runtime conventions, preserving privileged and unprivileged behavior, and removing an otherwise effect-free containerd dependency. Solvers must also trace mutable ownership across constructor, process, hook, mount, and Linux finalization, including values shared through pointers and spare slice capacity rather than only through obvious slice and map aliases; keep capability views and container snapshots independent under concurrency; and make multi-stage publication failure-atomic across process, mount, hook, and platform validation. The transaction extends to the container itself: setup stages that resolve container state while building a profile must not record it until publication succeeds, yet must still record it on success, so a faithful port of the upstream change alone leaves observable failure-path side effects behind."
