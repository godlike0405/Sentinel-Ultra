difficulty_explanation = "The change spans five new internal modules and eight existing ones, and the correct behaviour is only observable through the interaction of four subsystems: an adapter protocol with optional-method probing, an asynchronous write path that peels mirror frames out of the receive loop and batches them with eager count/byte flushing under concurrency, a read path that materialises a stored transcript into a throwaway CLAUDE_CONFIG_DIR with credential redaction, path-traversal guards and cleanup on every spawn-failure and cancellation path, and nine store-backed session helpers that must mirror the semantics of nine existing synchronous helpers without changing them. Failure modes are non-local (a missed flush before the result message, a temp directory leaked on one of seven abort paths, a project key that diverges from the CLI's own derivation) and are not discoverable by running the existing suite."
